<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Join Rasika</title>

    <link rel="stylesheet" href="rasika.css">

</head>

<body>

    <!-- =========================================
         NAVIGATION
    ========================================== -->

    <header class="navbar">

        <div class="logo">
            Rasika
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="pages/story.html">Our Story</a>

            <a href="pages/learn.html">Learn</a>

            <a href="pages/workshops.html">Workshops</a>

            <a href="pages/stage.html">Stage</a>

            <a href="pages/contests.html">Contests</a>

            <a href="join.html" class="active">Join</a>

        </nav>

    </header>


    <!-- =========================================
         JOIN SECTION
    ========================================== -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <p class="eyebrow">
                    BEGIN YOUR JOURNEY
                </p>

                <h1>
                    Join Rasika
                </h1>

                <p>
                    Step into a space where movement becomes
                    expression, confidence and connection.
                </p>

            </div>

        </section>


        <!-- =====================================
             REGISTRATION FORM
        ====================================== -->

        <section class="section">

            <div class="section-heading">

                <p class="eyebrow">
                    REGISTRATION
                </p>

                <h2>
                    Tell Us About You
                </h2>

                <p>
                    Fill in your details and our Rasika team
                    will get in touch with you.
                </p>

            </div>


            <div class="form-container">

                <form id="registrationForm">


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- AGE -->

                    <div class="form-group">

                        <label for="age">
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Enter your age"
                            min="5"
                            max="100"
                            required
                        >

                    </div>


                    <!-- DANCE STYLE -->

                    <div class="form-group">

                        <label for="danceStyle">
                            Dance Style
                        </label>

                        <select
                            id="danceStyle"
                            name="danceStyle"
                            required
                        >

                            <option value="">
                                Select a dance style
                            </option>

                            <option value="Classical">
                                Classical
                            </option>

                            <option value="Contemporary">
                                Contemporary
                            </option>

                            <option value="Bollywood">
                                Bollywood
                            </option>

                            <option value="Hip-Hop">
                                Hip-Hop
                            </option>

                            <option value="Western">
                                Western
                            </option>

                            <option value="Folk & Traditional">
                                Folk & Traditional
                            </option>

                            <option value="Fusion">
                                Fusion
                            </option>

                            <option value="Semi-Classical">
                                Semi-Classical
                            </option>

                        </select>

                    </div>


                    <!-- LEVEL -->

                    <div class="form-group">

                        <label for="level">
                            Dance Level
                        </label>

                        <select
                            id="level"
                            name="level"
                            required
                        >

                            <option value="">
                                Select your level
                            </option>

                            <option value="Beginner">
                                Beginner
                            </option>

                            <option value="Intermediate">
                                Intermediate
                            </option>

                            <option value="Advanced">
                                Advanced
                            </option>

                        </select>

                    </div>


                    <!-- INTEREST -->

                    <div class="form-group">

                        <label for="interest">
                            What are you interested in?
                        </label>

                        <select
                            id="interest"
                            name="interest"
                            required
                        >

                            <option value="">
                                Select an option
                            </option>

                            <option value="Regular Classes">
                                Regular Classes
                            </option>

                            <option value="Workshops">
                                Workshops
                            </option>

                            <option value="Stage Performances">
                                Stage Performances
                            </option>

                            <option value="Competitions">
                                Competitions
                            </option>

                            <option value="All">
                                All of the Above
                            </option>

                        </select>

                    </div>


                    <!-- MESSAGE -->

                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            placeholder="Tell us anything you'd like us to know..."
                        ></textarea>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="btn"
                    >
                        Submit Registration →
                    </button>

                </form>


                <!-- SUCCESS / ERROR MESSAGE -->

                <div
                    id="formMessage"
                    class="form-message"
                    style="display: none;"
                ></div>

            </div>

        </section>

    </main>


    <!-- =========================================
         SCRIPTS
    ========================================== -->

    <!-- Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your Rasika JavaScript -->
    <script src="rasika.js"></script>

</body>

</html>
